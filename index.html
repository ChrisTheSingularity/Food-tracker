<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Livsmedelsverket Food Search</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px; }
        #results { margin-top: 20px; }
        .food-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    </style>
</head>
<body>
    <h1>Sök svenska livsmedel</h1>
    <input type="text" id="search" placeholder="Ex: ägg, bröd, kyckling">
    <button onclick="searchFood()">Sök</button>

    <div id="results"></div>

    <script>
        async function searchFood() {
            const query = document.getElementById('search').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Söker...';

            const response = await fetch(`https://dataportal.livsmedelsverket.se/api/food/?query=${encodeURIComponent(query)}`);
            
            if (!response.ok) {
                resultsDiv.innerHTML = 'Fel vid hämtning av data.';
                return;
            }

            const data = await response.json();
            resultsDiv.innerHTML = '';

            if (data.length === 0) {
                resultsDiv.innerHTML = 'Inga resultat hittades.';
                return;
            }

            data.slice(0, 10).forEach(item => {
                const div = document.createElement('div');
                div.className = 'food-item';
                div.innerHTML = `
                    <strong>${item.name}</strong><br>
                    Energi: ${item.energyKcal} kcal<br>
                    Protein: ${item.protein} g<br>
                    Kolhydrater: ${item.carbohydrates} g<br>
                    Fett: ${item.fat} g
                `;
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
